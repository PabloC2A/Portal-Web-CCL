<div class="modal fade" id="solicitudDetallesModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable" role="document">
        <div class="modal-content">
            
            <div class="modal-header">
                <h5 class="modal-title">Detalles de Solicitud - Ticket <span id="modal-ticket"></span></h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <div id="modal-error-container" class="mb-3"></div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <small class="text-muted">Fecha de envío:</small>
                        <p id="modal-fecha-envio" class="font-weight-bold"></p>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted">Estado actual:</small>
                        <div id="modal-estado-container"></div>
                    </div>
                </div>

                <div class="row">

                    <div class="col-lg-6 mb-4 mb-lg-0">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-transparent">
                                <h5 class="mb-0">Solicitante</h5>
                            </div>
                            <div class="card-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item px-0"><strong>Nombre:</strong> <span id="modal-nombre-usuario"></span></li>
                                    <li class="list-group-item px-0"><strong>Cédula/RUC:</strong> <span id="modal-ruc-usuario"></span></li>
                                    <li class="list-group-item px-0"><strong>Email:</strong> <span id="modal-email-usuario"></span></li>
                                    <li class="list-group-item px-0"><strong>Teléfono:</strong> <span id="modal-telefono-usuario"></span></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div id="tarjeta-empresa" class="card shadow-sm mb-4" style="display: none;">
                            <div class="card-header bg-transparent">
                                <h5 class="mb-0">Empresa</h5>
                            </div>
                            <div class="card-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item px-0"><strong>Razón Social:</strong> <span id="modal-razon-social"></span></li>
                                    <li class="list-group-item px-0"><strong>Nombre Comercial:</strong> <span id="modal-nombre-comercial"></span></li>
                                    <li class="list-group-item px-0"><strong>Dirección:</strong> <span id="modal-direccion"></span></li>
                                </ul>
                            </div>
                        </div>

                        <div class="card shadow-sm">
                            <div class="card-header bg-transparent">
                                <h5 class="mb-0">Documentos Adjuntos</h5>
                            </div>
                            <div class="list-group list-group-flush" id="modal-documentos-list">
                                </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-danger" id="btnModalRechazar" data-url="">Rechazar</button>
                <button type="button" class="btn btn-success" id="btnModalAceptar" data-url="">Aceptar</button>
            </div>

        </div>
    </div>
</div>
