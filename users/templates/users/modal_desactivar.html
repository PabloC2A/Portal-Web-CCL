<div class="modal fade" id="desactivarUsuarioModal-{{ usuario.pk }}" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-danger modal-dialog-centered modal-sm" role="document">
        <div class="modal-content bg-gradient-danger">
            <div class="modal-header">
                <h6 class="modal-title" id="modal-title-notification">Confirmación Requerida</h6>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="py-3 text-center">
                    <i class="ni ni-bell-55 ni-3x"></i>
                    <h4 class="heading mt-4">¡Cuidado!</h4>
                    <p>
                        ¿Estás seguro de que deseas desactivar al usuario
                        <strong>"{{ usuario.username }}"</strong>?
                    </p>
                </div>
            </div>
            <div class="modal-footer">
                <form method="post" action="{% url 'desactivar_usuario' pk=usuario.pk %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-white">Sí, desactivar</button>
                </form>
                <button type="button" class="btn btn-link text-white ml-auto" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>
