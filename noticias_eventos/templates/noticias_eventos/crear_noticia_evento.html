<div class="modal fade" id="crearNoticiaEventoModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <form method="post" action="" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="ni ni-single-copy-04 mr-2"></i>Crear Noticia o Evento</h5>
                    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="titulo">Título</label>
                        <input type="text" class="form-control" name="titulo" id="titulo">
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="tipo">Tipo de Publicación</label>
                                <select class="form-control" name="tipo" id="tipo">
                                    <option value="noticia">Noticia</option>
                                    <option value="evento">Evento</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="fecha_evento">Fecha del Evento (si aplica)</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="ni ni-calendar-grid-58"></i></span>
                                    </div>
                                    <input class="form-control datepicker" name="fecha_evento" id="fecha_evento" type="text">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="contenido">Contenido</label>
                        <textarea class="form-control" name="contenido" id="contenido" rows="5"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="imagen">Imagen de Portada</label>
                        <input type="file" class="form-control" name="imagen" id="imagen">
                    </div>
                    <div class="form-group mt-4">
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" name="publicado" id="publicadoSwitch">
                            <label class="custom-control-label" for="publicadoSwitch">Publicar inmediatamente</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-link" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary ml-auto"><i class="fa fa-save mr-2"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
