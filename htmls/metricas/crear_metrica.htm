<div class="modal fade" id="crearMetricaModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <form method="post" action="">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="ni ni-fat-add mr-2"></i>Añadir Registro de Métrica</h5>
                    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="nombreMetrica">Nombre de la Métrica</label>
                        <select class="form-control" id="nombreMetrica" name="nombre">
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="valorMetrica">Valor (Categoría)</label>
                        <input type="text" class="form-control" id="valorMetrica" name="valor">
                    </div>
                    <div class="form-group">
                        <label for="descripcionMetrica">Descripción</label>
                        <textarea class="form-control" id="descripcionMetrica" name="descripcion" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-link" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary ml-auto"><i class="fa fa-save mr-2"></i>Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>
